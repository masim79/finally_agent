name: finally

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: finally
    container_name: finally
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - finally-data:/app/db
    restart: unless-stopped

volumes:
  finally-data:
